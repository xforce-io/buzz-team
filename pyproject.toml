[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buzz-team"
version = "0.1.0"
description = "Buzz 多 coding-agent 本机运行与管理层"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
buzz-team = "buzz_team.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
buzz_team = ["compatibility.json"]
